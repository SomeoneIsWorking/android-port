name: Android packaging plumbing CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    name: Linux host synthetic package contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: false
      - name: Run synthetic profile, staging, archive, and emulator-policy tests
        run: uv run --frozen python tests/test_android_port.py

  java-contract:
    name: ${{ matrix.os }} Java 17 Android framework contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run platform-free Android framework tests
        run: uv run --frozen python tests/test_android_java.py

  android-arm64:
    name: Android arm64-v8a API 35 native dependency prefix
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: false
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            cmake;3.31.6
            ndk;28.2.13676358
      - name: Select the pinned Android CMake
        run: echo "$ANDROID_SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"
      - name: Build the pinned asset-free Android dependency prefix
        env:
          ANDROID_NDK_VERSION: "28.2.13676358"
        run: >-
          uv run --frozen python tools/android_port.py build-native-deps
          --ndk "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          --abi arm64-v8a --api 35 --prefix "$PWD/build/ci/android/arm64-v8a-api35"
          --jobs 2
